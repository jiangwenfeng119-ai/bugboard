<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Human+AI Agents 报障闭环示意">
  <defs>
    <linearGradient id="sky" x1="80" y1="40" x2="560" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE8F8"/>
      <stop offset="1" stop-color="#F3F6FA"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="70" x2="470" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FAFD"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1A2B45" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#sky)"/>
  <circle cx="528" cy="78" r="52" fill="#B8D0F0" fill-opacity=".5"/>
  <circle cx="88" cy="392" r="68" fill="#C9D9EF" fill-opacity=".42"/>

  <g filter="url(#soft)">
    <rect x="108" y="48" width="424" height="384" rx="22" fill="url(#card)" stroke="#D5DEEA"/>

    <!-- brand mark -->
    <rect x="132" y="70" width="22" height="22" rx="6" fill="#1F6FEB"/>
    <path d="M137 76h10.5c.8 0 1.4.6 1.4 1.4V88h-7.4a2.6 2.6 0 0 1-2.6-2.6V76Z" fill="#fff" fill-opacity=".95"/>
    <text x="164" y="86" fill="#152033" font-family="'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif" font-size="15" font-weight="700">Human+AI Agents</text>

    <!-- tabs -->
    <text x="338" y="86" fill="#8A94A6" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="12">汇总</text>
    <text x="382" y="86" fill="#1F6FEB" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600">报障</text>
    <rect x="378" y="90" width="28" height="2.5" rx="1.25" fill="#1F6FEB"/>
    <text x="430" y="86" fill="#8A94A6" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="12">成员</text>

    <!-- status chips: agent loop + man-in-the-loop -->
    <g font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600">
      <rect x="132" y="112" width="58" height="24" rx="12" fill="#F8E8D4"/>
      <circle cx="146" cy="124" r="3.2" fill="#B45309"/>
      <text x="154" y="128" fill="#B45309">待处理</text>

      <rect x="198" y="112" width="58" height="24" rx="12" fill="#DCE9FB"/>
      <circle cx="212" cy="124" r="3.2" fill="#1F6FEB"/>
      <text x="220" y="128" fill="#1F6FEB">修复中</text>

      <rect x="264" y="112" width="58" height="24" rx="12" fill="#E0F2FE"/>
      <circle cx="278" cy="124" r="3.2" fill="#0284C7"/>
      <text x="286" y="128" fill="#0284C7">待发布</text>

      <rect x="330" y="112" width="58" height="24" rx="12" fill="#E8E4F7"/>
      <circle cx="344" cy="124" r="3.2" fill="#5B4BB5"/>
      <text x="352" y="128" fill="#5B4BB5">待确认</text>

      <rect x="396" y="112" width="110" height="24" rx="12" fill="#F3E8FF"/>
      <circle cx="410" cy="124" r="3.2" fill="#7C3AED"/>
      <text x="418" y="128" fill="#7C3AED">待产品经理确认</text>
    </g>

    <!-- bug rows -->
    <rect x="132" y="154" width="376" height="58" rx="14" fill="#EEF4FB" stroke="#D5DEEA"/>
    <rect x="148" y="172" width="30" height="18" rx="5" fill="#FEE2E2"/>
    <text x="154" y="185" fill="#B91C1C" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" font-weight="700">P1</text>
    <text x="190" y="178" fill="#152033" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600">登录按钮偶发无响应</text>
    <text x="190" y="196" fill="#8A94A6" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11">Agent 自动处理中</text>
    <rect x="430" y="170" width="60" height="24" rx="12" fill="#DCE9FB"/>
    <text x="442" y="186" fill="#1F6FEB" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600">修复中</text>

    <rect x="132" y="224" width="376" height="58" rx="14" fill="#EEF4FB" stroke="#D5DEEA"/>
    <rect x="148" y="242" width="30" height="18" rx="5" fill="#FEF3C7"/>
    <text x="154" y="255" fill="#B45309" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" font-weight="700">P2</text>
    <text x="190" y="248" fill="#152033" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="13" font-weight="600">侧栏提交点击被拦截</text>
    <text x="190" y="266" fill="#8A94A6" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11">人在回路 · 原报障人确认</text>
    <rect x="430" y="240" width="60" height="24" rx="12" fill="#E8E4F7"/>
    <text x="442" y="256" fill="#5B4BB5" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11" font-weight="600">待确认</text>

    <!-- flow strip -->
    <rect x="132" y="300" width="376" height="104" rx="14" fill="#F8FAFC" stroke="#D5DEEA"/>
    <text x="148" y="324" fill="#5A6678" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600">Agent 自动处理</text>
    <text x="360" y="324" fill="#5A6678" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="12" font-weight="600">人在回路把关</text>

    <line x1="168" y1="358" x2="472" y2="358" stroke="#D5DEEA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="168" cy="358" r="8" fill="#B45309"/>
    <circle cx="250" cy="358" r="8" fill="#1F6FEB"/>
    <circle cx="332" cy="358" r="8" fill="#0284C7"/>
    <circle cx="414" cy="358" r="8" fill="#5B4BB5"/>
    <circle cx="472" cy="358" r="8" fill="#7C3AED"/>

    <g font-family="'Noto Sans SC',system-ui,sans-serif" font-size="11" fill="#5A6678" text-anchor="middle">
      <text x="168" y="384">待处理</text>
      <text x="250" y="384">修复中</text>
      <text x="332" y="384">待发布</text>
      <text x="414" y="384">待确认</text>
      <text x="472" y="384">产品确认</text>
    </g>
  </g>

  <g transform="translate(468 336)">
    <circle r="42" fill="#0B3D91"/>
    <path d="M-13 0h26M0-13v26" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="-26" r="13" fill="#1B7F4A"/>
    <path d="M20.5-26l3.8 3.8 7.5-8.2" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
